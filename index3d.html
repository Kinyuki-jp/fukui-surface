<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>FUKUI SURFACE 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Orbitron','Courier New',monospace}
canvas{display:block}

/* ── SCANLINES ─────────────────────── */
#scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:55;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 3px,
    rgba(0,255,255,.018) 3px,rgba(0,255,255,.018) 4px
  );
}

/* ── VIGNETTE ──────────────────────── */
#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:54;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);
}

/* ── T-REX OVERLAY ─────────────────── */
#trex-wrap{
  position:fixed;bottom:0;left:0;right:0;z-index:52;
  pointer-events:none;overflow:hidden;
  height:0;opacity:0;
  transition:height .12s ease-out, opacity .2s;
}
#trex-wrap img{
  width:100%;display:block;
  object-fit:cover;object-position:top center;
  filter:contrast(1.25) saturate(1.15) brightness(.88);
}
/* red edge glow when raptor close */
#trex-wrap::after{
  content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 80px rgba(255,0,0,.45);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#trex-wrap.danger::after{opacity:1}

/* ── SPEED LINES ───────────────────── */
#speedlines{
  position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,
    transparent 28%,
    rgba(0,200,255,.0) 40%,
    rgba(0,80,255,.06) 70%,
    rgba(0,20,100,.18) 100%);
  opacity:0;transition:opacity .4s;
}

/* ── HUD ───────────────────────────── */
#hud{
  position:fixed;top:0;left:0;right:0;
  padding:14px 20px;display:flex;
  justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:60;
}
#score{
  font-size:32px;font-weight:900;letter-spacing:3px;
  color:#00ffff;
  text-shadow:0 0 8px #00ffff,0 0 24px #0088ff,0 0 50px #0033ff;
}
#lenses{
  font-size:13px;margin-top:5px;letter-spacing:2px;
  color:#ff00cc;text-shadow:0 0 8px #ff00cc,0 0 20px #aa0088;
}
#rhud{text-align:right}
#gtitle{
  font-size:15px;font-weight:900;letter-spacing:4px;
  color:#00ffff;text-shadow:0 0 10px #00ffff;
}
#spd{
  font-size:12px;margin-top:6px;letter-spacing:2px;
  color:#aaff00;text-shadow:0 0 8px #aaff00;
}
#gsub{
  font-size:8px;letter-spacing:1.5px;margin-top:2px;
  color:rgba(0,255,255,.45);text-align:right;
}

/* ── DANGER BAR (top) ──────────────── */
#dangerbar{
  position:fixed;top:0;left:0;z-index:62;height:3px;
  width:0%;background:linear-gradient(90deg,#ff2200,#ff8800);
  box-shadow:0 0 14px #ff2200;transition:width .25s;
}
#dangertxt{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:18px;font-weight:900;letter-spacing:4px;
  color:#ff2200;text-shadow:0 0 16px #ff0000;
  pointer-events:none;z-index:65;
  opacity:0;transition:opacity .2s;
}
#dangertxt.show{opacity:1}

/* ── STAGE BANNER ──────────────────── */
#banner{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%);
  background:rgba(0,10,30,.88);
  border:1px solid rgba(0,255,255,.5);border-radius:3px;
  padding:8px 26px;
  color:#00ffff;font-size:13px;font-weight:700;letter-spacing:3px;
  box-shadow:0 0 20px rgba(0,255,255,.35),inset 0 0 16px rgba(0,255,255,.05);
  pointer-events:none;z-index:60;
  transition:opacity .6s;opacity:0;
}
#banner.show{opacity:1}

/* ── START / GAMEOVER OVERLAY ──────── */
#overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,4,16,.92);backdrop-filter:blur(12px);z-index:70;
}
#overlay h1{
  font-size:clamp(34px,9vw,80px);font-weight:900;text-align:center;
  color:#00ffff;letter-spacing:6px;
  text-shadow:0 0 18px #00ffff,0 0 50px #0055ff;
  line-height:1.1;margin-bottom:10px;
  animation:glitch 5s infinite;
}
@keyframes glitch{
  0%,85%,100%{text-shadow:0 0 18px #00ffff,0 0 50px #0055ff;transform:none}
  87%{transform:translate(-5px,1px) skewX(-2deg);
      text-shadow:5px 0 #ff00cc,-5px 0 #00ffff,0 0 30px #ff00cc}
  90%{transform:translate(5px,-2px) skewX(2deg);
      text-shadow:-5px 0 #ff00cc,5px 0 #00ffff}
  93%{transform:translate(-2px,3px)}
}
.osub{
  color:#336;font-size:13px;margin-bottom:32px;
  text-align:center;letter-spacing:2px;line-height:1.8;
}
.dino-photo{
  width:min(54vw,300px);border-radius:10px;
  border:2px solid rgba(255,90,50,.65);
  box-shadow:0 0 34px rgba(255,70,25,.55);
  filter:contrast(1.2) saturate(1.2);
  margin-bottom:20px;
}
#sbtn{
  padding:15px 50px;font-size:16px;font-weight:900;
  font-family:'Orbitron',monospace;letter-spacing:4px;
  background:transparent;color:#00ffff;
  border:2px solid #00ffff;border-radius:3px;cursor:pointer;
  text-shadow:0 0 10px #00ffff;
  box-shadow:0 0 22px rgba(0,255,255,.45),inset 0 0 16px rgba(0,255,255,.06);
  transition:all .18s;
}
#sbtn:hover{
  background:rgba(0,255,255,.12);
  box-shadow:0 0 44px rgba(0,255,255,.8),inset 0 0 28px rgba(0,255,255,.18);
  transform:scale(1.05);
}

/* ── BOTTOM HINT ───────────────────── */
#ctrl{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  color:rgba(0,255,255,.3);font-size:10px;letter-spacing:2px;
  pointer-events:none;z-index:60;
}

/* ── VIRTUAL D-PAD ─────────────────── */
#dpad{
  position:fixed;bottom:20px;right:20px;
  z-index:60;user-select:none;
  display:grid;grid-template-columns:56px 56px 56px;
  grid-template-rows:56px 56px 56px;gap:5px;
}
.db{
  width:56px;height:56px;
  background:rgba(0,255,255,.07);
  border:1.5px solid rgba(0,255,255,.4);
  border-radius:6px;
  color:#00ffff;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,255,.2);
  transition:background .08s,box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
.db.pressed,.db:active{
  background:rgba(0,255,255,.28);
  box-shadow:0 0 26px rgba(0,255,255,.7);
}
/* Grid positions: row/col */
#db-up   {grid-column:2;grid-row:1}
#db-left {grid-column:1;grid-row:2}
#db-mid  {grid-column:2;grid-row:2;opacity:.3;cursor:default;font-size:10px}
#db-right{grid-column:3;grid-row:2}
#db-down {grid-column:2;grid-row:3}

.hidden{display:none!important}

/* ── MOVING SCAN PULSE ─────────────── */
#scanpulse{
  position:fixed;inset:0;pointer-events:none;z-index:56;overflow:hidden;
}
#scanpulse::after{
  content:'';position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,255,255,.12) 30%,rgba(0,255,255,.08) 70%,transparent);
  animation:scanmove 5s linear infinite;
}
@keyframes scanmove{from{top:-2px}to{top:100%}}

/* ── SCREEN SHAKE ──────────────────── */
@keyframes camshake{
  0%,100%{transform:none}
  20%{transform:translate(-2px,1px) skewX(-.3deg)}
  40%{transform:translate(2px,-1px) skewX(.2deg)}
  60%{transform:translate(-1px,2px)}
  80%{transform:translate(1px,-1px) skewX(.1deg)}
}
body.camshake{animation:camshake .12s linear infinite}

/* ── CORNER BRACKETS ───────────────── */
.cnr{
  position:fixed;width:24px;height:24px;
  pointer-events:none;border-style:solid;
  border-color:rgba(0,255,255,.75);z-index:58;
  box-shadow:0 0 6px rgba(0,255,255,.5),0 0 16px rgba(0,255,255,.15);
}
#cnr-tl{top:8px;left:8px;  border-width:2px 0 0 2px;}
#cnr-tr{top:8px;right:8px; border-width:2px 2px 0 0;}
#cnr-bl{bottom:8px;left:8px;  border-width:0 0 2px 2px;}
#cnr-br{bottom:8px;right:8px; border-width:0 2px 2px 0;}

/* ── DANGER VIGNETTE PULSE ─────────── */
#dpulse{
  position:fixed;inset:0;pointer-events:none;z-index:53;opacity:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(200,0,0,.5) 100%);
}
@keyframes rpulse{0%,100%{opacity:0}50%{opacity:1}}
#dpulse.on{animation:rpulse .45s ease-in-out infinite}

/* ── CYBER GRID OVERLAY ─────────────── */
#gridoverlay{
  position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;
  transition:opacity 1.2s;
  background-image:
    linear-gradient(rgba(0,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,.022) 1px,transparent 1px);
  background-size:72px 72px;
}
#gridoverlay.on{opacity:1}

/* ── T-REX: chromatic aberration on danger ── */
#trex-wrap img{transition:filter .3s}
#trex-wrap.danger img{
  filter:contrast(1.5) saturate(1.4) brightness(.82)
    drop-shadow(0 0 18px rgba(255,30,0,.85))
    drop-shadow(5px 0 0 rgba(255,0,180,.4))
    drop-shadow(-5px 0 0 rgba(0,255,255,.3));
}

/* ── HUD SEPARATOR ───────────────────── */
#hudline{
  position:fixed;top:62px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,255,.3) 25%,rgba(0,255,255,.3) 75%,transparent);
  pointer-events:none;z-index:59;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Atmosphere layers -->
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="speedlines"></div>

<!-- Cyber enhancement layers -->
<div id="scanpulse"></div>
<div id="dpulse"></div>
<div id="gridoverlay"></div>
<div id="hudline"></div>
<div class="cnr" id="cnr-tl"></div>
<div class="cnr" id="cnr-tr"></div>
<div class="cnr" id="cnr-bl"></div>
<div class="cnr" id="cnr-br"></div>

<!-- T-Rex chaser overlay (rises from bottom) -->
<div id="trex-wrap">
  <img id="trex-img" src="assets/trex.jpg" alt="">
</div>

<!-- Danger -->
<div id="dangerbar"></div>
<div id="dangertxt">⚠ FUKUIRAPTOR ⚠</div>

<!-- HUD -->
<div id="hud">
  <div>
    <div id="score">000000</div>
    <div id="lenses">👓 メガネ × 0</div>
  </div>
  <div id="rhud">
    <div id="gtitle">FUKUI SURFACE</div>
    <div id="gsub">恐竜王国 × 鯖江の眼鏡</div>
    <div id="spd">SPD 019</div>
  </div>
</div>

<div id="banner">🦕 DINO RUINS</div>

<!-- Start / Game-over overlay -->
<div id="overlay">
  <img class="dino-photo" src="assets/trex.jpg" alt="">
  <h1>FUKUI<br>SURFACE</h1>
  <div class="osub">福井の渓谷を走れ・鯖江の眼鏡を集めろ<br>[ フクイラプトルから逃げろ ]</div>
  <button id="sbtn" onclick="startGame()">▶ スタート</button>
  <div style="color:#223;margin-top:20px;font-size:10px;letter-spacing:2px">
    D-PAD / ARROWS &nbsp;·&nbsp; SPACE JUMP &nbsp;·&nbsp; ↓ SLIDE
  </div>
</div>

<div id="ctrl" class="hidden">D-PAD / ARROWS &nbsp;·&nbsp; SPACE JUMP &nbsp;·&nbsp; ↓ SLIDE</div>

<!-- Virtual D-pad (bottom-right) -->
<div id="dpad">
  <div class="db" id="db-up">▲</div>
  <div class="db" id="db-left">◀</div>
  <div class="db" id="db-mid">●</div>
  <div class="db" id="db-right">▶</div>
  <div class="db" id="db-down">▼</div>
</div>

<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const LANES      = [-3.5, 0, 3.5];
const SEG_LEN    = 32;
const SEGS_AHEAD = 9;
const SEGS_BACK  = 2;
const GRAVITY    = 34;
const JUMP_VY    = 15;
const BASE_SPEED = 19;
const STAGE_DIST = 900;

const CAM_BACK        = 22;   // camera distance behind player
const MTN_RANGE       = 420;  // mountain ridge tiling length

const TREX_START_GAP  = 60;
const TREX_GAIN_RATE  = 0.05;
const TREX_HIT_GAIN   = 14;

// Fukui scenic stages — bright daytime nature, dinosaur valley, glasses
const STAGES = [
  {name:'🦕 恐竜渓谷', sub:'KATSUYAMA DINO VALLEY',
   sky:0x9fd4ff, fog:0xcfe9ff, track:0x8a7d63, wall:0x6a5d44, bld:0x4a6a3a, acc:0xffd23c},
  {name:'🌸 西山公園', sub:'NISHIYAMA PARK · SABAE',
   sky:0xffd6ea, fog:0xffe7f3, track:0x7a6a58, wall:0x6a6a4a, bld:0x4a7a44, acc:0xff79b0},
  {name:'🌊 越前海岸', sub:'ECHIZEN COAST',
   sky:0x7fcfe8, fog:0xcdeaf4, track:0x9a9276, wall:0x7a8a8a, bld:0x3a6a8a, acc:0x33d2ff},
  {name:'⛩️ 永平寺', sub:'EIHEIJI MOUNTAINS',
   sky:0x9fc0d4, fog:0xcfe0e8, track:0x6a6250, wall:0x5a5a42, bld:0x3a4a36, acc:0x55ffaa},
];

// ═══════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 600);
const clock  = new THREE.Clock();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

const ambient  = new THREE.AmbientLight(0xffffff, 0.95);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.1);
sun.castShadow = true;
Object.assign(sun.shadow.camera,{near:.1,far:140,left:-30,right:30,top:30,bottom:-30});
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x4a6a3a, 0.85);
scene.add(hemi);

// ═══════════════════════════════════════════
//  MATERIALS
// ═══════════════════════════════════════════
const M = {
  playerBody: new THREE.MeshLambertMaterial({color:0x0088ff}),
  playerHead: new THREE.MeshLambertMaterial({color:0xffcc88}),
  glasses:    new THREE.MeshLambertMaterial({color:0x0033aa}),
  glassLens:  new THREE.MeshLambertMaterial({color:0x44aaff,transparent:true,opacity:.7}),
  legPant:    new THREE.MeshLambertMaterial({color:0x1144aa}),
  obsRed:     new THREE.MeshLambertMaterial({color:0xff2222}),
  obsOrange:  new THREE.MeshLambertMaterial({color:0xff7700}),
  lens:       new THREE.MeshLambertMaterial({color:0x00ffee,emissive:0x005544}),
  shadow:     new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.3}),
  lane:       new THREE.MeshBasicMaterial({color:0x00ffff,transparent:true,opacity:.1}),
};
let trackMat = new THREE.MeshLambertMaterial({color:0x7a7060});
let wallMat  = new THREE.MeshLambertMaterial({color:0x504838});
let bldMat   = new THREE.MeshLambertMaterial({color:0x304028});

function applyStage(st){
  scene.background = new THREE.Color(st.sky);
  scene.fog        = new THREE.FogExp2(st.fog, 0.0038); // light haze so mountains show
  trackMat.color.setHex(st.track);
  wallMat.color.setHex(st.wall);
  bldMat.color.setHex(st.bld);
  // Bright daytime nature lighting; sky tints the hemisphere fill
  sun.color.setHex(0xfff0d0);
  hemi.color.setHex(st.sky);
  M.obsRed.color.setHex(0xff3322);
  M.obsOrange.color.setHex(0xff8800);
  const go=document.getElementById('gridoverlay');
  if(go) go.classList.remove('on');
}

// ═══════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════
let pg, leftLeg, rightLeg, legT=0;
function buildPlayer(){
  pg = new THREE.Group();
  const add=(geo,mat,x,y,z)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z);m.castShadow=true;pg.add(m);return m;
  };
  add(new THREE.BoxGeometry(1.05,1.45,.65),M.playerBody,0,1.45,0);
  add(new THREE.BoxGeometry(.85,.85,.78),  M.playerHead,0,2.5,0);
  add(new THREE.BoxGeometry(.95,.18,.08),  M.glasses,   0,2.5,.42);
  const lg=new THREE.CylinderGeometry(.21,.21,.07,12);
  const lL=add(lg,        M.glassLens,-.27,2.5,.44);
  const lR=add(lg.clone(),M.glassLens, .27,2.5,.44);
  lL.rotation.x=lR.rotation.x=Math.PI/2;
  const ag=new THREE.BoxGeometry(.3,.92,.3);
  add(ag,        M.playerBody,-.68,1.52,0);
  add(ag.clone(),M.playerBody, .68,1.52,0);
  const legG=new THREE.BoxGeometry(.38,.9,.38);
  leftLeg =add(legG,        M.legPant,-.28,.45,0);
  rightLeg=add(legG.clone(),M.legPant, .28,.45,0);
  // Neon trail aura
  const aura=new THREE.Mesh(
    new THREE.SphereGeometry(1.2,10,8),
    new THREE.MeshBasicMaterial({color:0x0044ff,transparent:true,opacity:.06,side:THREE.BackSide})
  );
  pg.add(aura);
  // Drop shadow
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.85,14),M.shadow);
  sh.rotation.x=-Math.PI/2;sh.position.y=.02;
  pg.add(sh);pg.userData.shadow=sh;
  scene.add(pg);
}

// ═══════════════════════════════════════════
//  T-REX  (procedural 3D + image overlay)
// ═══════════════════════════════════════════
// ── Fukuiraptor: low-poly 3D chaser that runs behind the player
let dino=null, trexShadow=null, trexLegT=0;
let trexGap=TREX_START_GAP;

function buildTrex(){
  if(dino){scene.remove(dino);dino=null;}
  if(trexShadow){scene.remove(trexShadow);trexShadow=null;}

  dino=new THREE.Group();
  const skin =new THREE.MeshLambertMaterial({color:0xc24a2c,flatShading:true});
  const skinD=new THREE.MeshLambertMaterial({color:0x8f3320,flatShading:true});
  const belly=new THREE.MeshLambertMaterial({color:0xe0b070});
  const teeth=new THREE.MeshBasicMaterial({color:0xfff2e0});
  const eyeM =new THREE.MeshBasicMaterial({color:0xffd000});
  const dark =new THREE.MeshLambertMaterial({color:0x241008});
  const P=(geo,mat,x,y,z,par)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;(par||dino).add(m);return m;};

  // Torso + belly (head faces +z toward player; camera views it from behind)
  P(new THREE.BoxGeometry(1.8,2.0,3.2),skin,0,2.7,0);
  P(new THREE.BoxGeometry(1.5,1.0,2.9),belly,0,2.15,0.12);
  // Dorsal spikes (bigger — clearer theropod silhouette)
  for(let i=0;i<6;i++) P(new THREE.ConeGeometry(0.2,0.85,4),skinD,0,3.78,1.35-i*0.5);
  // Curved neck rising from the shoulders toward a high, craned head
  const neck1=P(new THREE.BoxGeometry(0.98,1.6,0.98),skin,0,3.55,1.3); neck1.rotation.x=-0.5;
  const neck2=P(new THREE.BoxGeometry(0.9,1.35,0.92),skin,0,4.5,1.95); neck2.rotation.x=0.32;
  // Head group — large, raised high & craned forward over the prey
  const head=new THREE.Group(); head.position.set(0,5.15,2.25); head.rotation.x=0.42; dino.add(head);
  P(new THREE.BoxGeometry(1.2,1.15,1.55),skin,0,0,0.1,head);        // skull
  P(new THREE.BoxGeometry(0.98,0.62,1.5),skin,0,-0.26,1.2,head);    // snout
  P(new THREE.BoxGeometry(0.55,0.4,0.6),skinD,0,0.55,0.05,head);    // brow ridge
  const jaw=new THREE.Group(); jaw.position.set(0,-0.58,0.5); head.add(jaw);
  P(new THREE.BoxGeometry(0.9,0.36,1.4),skinD,0,0,0.62,jaw);        // lower jaw
  for(const sx of[-0.3,0,0.3]){ const t=P(new THREE.ConeGeometry(0.085,0.36,4),teeth,sx,-0.58,1.8,head); t.rotation.x=Math.PI; }
  P(new THREE.SphereGeometry(0.21,9,7),eyeM, 0.5,0.36,0.55,head);
  P(new THREE.SphereGeometry(0.21,9,7),eyeM,-0.5,0.36,0.55,head);
  P(new THREE.SphereGeometry(0.1,6,5),dark, 0.57,0.36,0.7,head);
  P(new THREE.SphereGeometry(0.1,6,5),dark,-0.57,0.36,0.7,head);
  // Tiny arms
  P(new THREE.BoxGeometry(0.2,0.75,0.2),skinD, 0.95,2.5,1.0);
  P(new THREE.BoxGeometry(0.2,0.75,0.2),skinD,-0.95,2.5,1.0);
  // Animated legs (hip + knee pivots)
  function leg(side){
    const hip=new THREE.Group(); hip.position.set(side*0.62,2.0,-0.2); dino.add(hip);
    P(new THREE.BoxGeometry(0.55,1.7,0.62),skin,0,-0.75,0,hip);
    const knee=new THREE.Group(); knee.position.set(0,-1.5,0); hip.add(knee);
    P(new THREE.BoxGeometry(0.42,1.2,0.46),skinD,0,-0.55,0.08,knee);
    P(new THREE.BoxGeometry(0.5,0.24,1.05),dark,0,-1.12,0.3,knee); // foot
    return {hip,knee};
  }
  const legL=leg(-1), legR=leg(1);
  // Animated tail (4 tapering segments)
  const tail=new THREE.Group(); tail.position.set(0,2.7,-1.5); dino.add(tail);
  let seg=tail; const tailSegs=[];
  for(let i=0;i<4;i++){
    const s=new THREE.Group(); s.position.set(0,0,-0.85);
    const w=0.85-i*0.17;
    P(new THREE.BoxGeometry(w,w,0.95),i%2?skin:skinD,0,0,-0.4,s);
    seg.add(s); tailSegs.push(s); seg=s;
  }
  dino.userData={head,jaw,legL,legR,tailSegs};
  scene.add(dino);

  // Ground shadow
  trexShadow=new THREE.Mesh(
    new THREE.CircleGeometry(2.6,22),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.4,depthWrite:false})
  );
  trexShadow.rotation.x=-Math.PI/2; trexShadow.position.y=0.05;
  scene.add(trexShadow);
}

function updateTrex(dt, move){
  if(!running) return;

  // ── Close the gap (slow gain; hitting an obstacle makes it lunge closer)
  trexGap-=move*TREX_GAIN_RATE;
  trexGap=Math.max(trexGap,1.4);
  trexLegT+=dt*Math.max(7, speed*0.55);

  // Cinematic distance mapping: safe → far & small, danger → close & looming.
  // Dino is always kept between the camera (pz-CAM_BACK) and the player (pz),
  // so it is clearly visible chasing WITHOUT ever covering the screen.
  const cg=Math.min(20, Math.max(3, trexGap));
  const D=3 + (cg-3)/17 * 14;          // 3..17 units ahead of the camera
  const visZ=pz - CAM_BACK + D;
  const dinoX=px*0.5;
  const near=Math.max(0, Math.min(1, (20-trexGap)/17)); // 0 far → 1 close

  if(dino){
    const bob=Math.abs(Math.sin(trexLegT))*0.28;
    dino.position.set(dinoX, bob, visZ);
    // Base 3/4 yaw reveals the head, jaws & running stride (reads as a dinosaur,
    // not just a back) + a little tracking toward the player's lane.
    dino.rotation.y=0.52 + Math.atan2(px-dinoX, 6)*0.4;
    const lunge=near*0.35;
    dino.rotation.x=-lunge;                         // lean in when closing
    const U=dino.userData;
    if(U){
      U.legL.hip.rotation.x= Math.sin(trexLegT)*0.85;
      U.legR.hip.rotation.x=-Math.sin(trexLegT)*0.85;
      U.legL.knee.rotation.x=Math.max(0, Math.cos(trexLegT))*0.7;
      U.legR.knee.rotation.x=Math.max(0,-Math.cos(trexLegT))*0.7;
      U.head.rotation.x=0.42 + Math.sin(trexLegT*0.5)*0.08 - lunge*0.55;
      U.jaw.rotation.x=0.2 + (0.3+near*0.5)*(0.5+0.5*Math.sin(trexLegT*0.7)); // chomp
      U.tailSegs.forEach((s,i)=>{ s.rotation.y=Math.sin(trexLegT*0.7 - i*0.6)*0.18; });
    }
  }
  if(trexShadow){
    trexShadow.position.set(dinoX,0.05,visZ);
    const ss=1.6+near*1.8;
    trexShadow.scale.setScalar(ss);
    trexShadow.material.opacity=0.22+near*0.26;
  }

  // ── Danger feedback (vignette / shake / bar / text)
  const dp=document.getElementById('dpulse');
  if(dp){ if(trexGap<12) dp.classList.add('on'); else dp.classList.remove('on'); }
  document.body.classList.toggle('camshake', trexGap<6);

  const pct=Math.max(0,Math.min(100,((TREX_START_GAP-trexGap)/TREX_START_GAP)*100));
  document.getElementById('dangerbar').style.width=pct+'%';

  const dtxt=document.getElementById('dangertxt');
  if(trexGap<14){
    dtxt.classList.add('show');
    const fl=Math.floor(Date.now()/280)%2===0;
    dtxt.style.opacity=trexGap<6?(fl?'1':'0.25'):'0.9';
    const jp=Math.floor(Date.now()/900)%2===0;
    dtxt.textContent=trexGap<4?'🦖 捕まる！ CAUGHT!'
      : jp?'🦖 フクイラプトル接近！':'⚠ FUKUIRAPTOR ⚠';
  } else {
    dtxt.classList.remove('show');
  }

  if(trexGap<2.0) die();
}

const colMat  =new THREE.MeshLambertMaterial({color:0x9a8a72});
const mossMat =new THREE.MeshLambertMaterial({color:0x2a6a1a});
const trnkMat =new THREE.MeshLambertMaterial({color:0x3a2510});
const leafA   =new THREE.MeshLambertMaterial({color:0x1a5a10});
const leafB   =new THREE.MeshLambertMaterial({color:0x2a8020});
const fernMat =new THREE.MeshLambertMaterial({color:0x1e7a14});
const wtrMat  =new THREE.MeshBasicMaterial({color:0x70b8ff,transparent:true,opacity:.55,side:THREE.DoubleSide});
const stoneMat=new THREE.MeshLambertMaterial({color:0x7a7060});
const crkMat  =new THREE.MeshBasicMaterial({color:0x2a2018});

function makeJungle(z){
  const g=new THREE.Group(); g.userData.z=z;

  // Stone path
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(11,SEG_LEN),stoneMat);
  fl.rotation.x=-Math.PI/2; fl.position.set(0,0,z+SEG_LEN/2);
  fl.receiveShadow=true; g.add(fl);
  // Tile grid
  for(let ti=0;ti<5;ti++){
    const ln=new THREE.Mesh(new THREE.PlaneGeometry(11,.08),crkMat);
    ln.rotation.x=-Math.PI/2; ln.position.set(0,.01,z+ti*(SEG_LEN/5)); g.add(ln);
  }
  for(const xi of[-3.5,0,3.5]){
    const vl=new THREE.Mesh(new THREE.PlaneGeometry(.07,SEG_LEN),crkMat);
    vl.rotation.x=-Math.PI/2; vl.position.set(xi,.01,z+SEG_LEN/2); g.add(vl);
  }
  // Random cracks
  for(let cr=0;cr<4;cr++){
    const ck=new THREE.Mesh(new THREE.PlaneGeometry(.08,1.5+Math.random()*2),crkMat);
    ck.rotation.x=-Math.PI/2; ck.rotation.z=Math.random()*Math.PI;
    ck.position.set((Math.random()-.5)*8,.011,z+Math.random()*SEG_LEN); g.add(ck);
  }
  // Mossy curbs
  for(const sx of[-1,1]){
    const cb=new THREE.Mesh(new THREE.BoxGeometry(.7,.45,SEG_LEN),colMat);
    cb.position.set(sx*5.85,.22,z+SEG_LEN/2); cb.receiveShadow=true; g.add(cb);
    const ms=new THREE.Mesh(new THREE.BoxGeometry(.75,.2,SEG_LEN*.9),mossMat);
    ms.position.set(sx*5.85,.46,z+SEG_LEN/2); ms.scale.y=.3; g.add(ms);
  }
  // Columns
  for(const side of[-1,1]){
    for(let c=0;c<3;c++){
      const cz=z+(c+.5)*(SEG_LEN/3)+(Math.random()-.5)*3;
      const cx=side*(7.5+Math.random()*3);
      const h=3.5+Math.random()*9;
      const brk=Math.random()>.5;
      const fh=brk?h*(.3+Math.random()*.5):h;
      const col=new THREE.Mesh(new THREE.CylinderGeometry(.55,.72,fh,8),colMat);
      col.position.set(cx,fh/2,cz); col.castShadow=true; g.add(col);
      if(!brk){
        const cap=new THREE.Mesh(new THREE.BoxGeometry(1.7,.5,1.7),colMat);
        cap.position.set(cx,fh+.25,cz); g.add(cap);
      }
      for(let mp=0;mp<2;mp++){
        const ms=new THREE.Mesh(new THREE.SphereGeometry(.55,6,5),mossMat);
        ms.position.set(cx+(Math.random()-.5)*.8,fh*(.3+Math.random()*.5),cz+(Math.random()-.5)*.8);
        ms.scale.set(1.2,.3,1.0); g.add(ms);
      }
      if(brk&&Math.random()>.4){
        const ch=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,1.8,8),colMat);
        ch.position.set(cx+side*(1.5+Math.random()),.4,cz+(Math.random()-.5)*3);
        ch.rotation.z=1.4+(Math.random()-.5)*.5; ch.castShadow=true; g.add(ch);
      }
    }
  }
  // Trees
  for(const side of[-1,1]){
    for(let t=0;t<2+Math.floor(Math.random()*2);t++){
      const tx=side*(10+Math.random()*9),tz=z+Math.random()*SEG_LEN,th=9+Math.random()*12;
      const isPalm=Math.random()>.5;
      const trk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.55,th,7),trnkMat);
      trk.position.set(tx,th/2,tz); trk.castShadow=true; g.add(trk);
      if(isPalm){
        for(let f=0;f<7;f++){
          const a=(f/7)*Math.PI*2,fl=3.5+Math.random()*2;
          const fr=new THREE.Mesh(new THREE.BoxGeometry(.18,.1,fl),leafB);
          fr.position.set(tx+Math.cos(a)*1.5,th+.3,tz+Math.sin(a)*1.5);
          fr.rotation.y=a; fr.rotation.z=.55; g.add(fr);
        }
        const cr=new THREE.Mesh(new THREE.SphereGeometry(1.3,7,6),leafA);
        cr.position.set(tx,th+.5,tz); cr.scale.y=.5; g.add(cr);
      } else {
        for(let b=0;b<3;b++){
          const r=2.2+Math.random()*2;
          const bl=new THREE.Mesh(new THREE.SphereGeometry(r,7,6),b%2?leafA:leafB);
          bl.position.set(tx+(Math.random()-.5)*2.5,th-b*.6+Math.random()*1.5,tz+(Math.random()-.5)*2.5);
          bl.scale.y=.65; g.add(bl);
        }
      }
    }
  }
  // Ferns
  for(const side of[-1,1]){
    for(let f=0;f<5+Math.floor(Math.random()*4);f++){
      const fn=new THREE.Mesh(new THREE.SphereGeometry(.7+Math.random()*.5,6,5),fernMat);
      fn.position.set(side*(6.2+Math.random()*1.5),.35,z+Math.random()*SEG_LEN);
      fn.scale.set(1.6,.45,1.4); g.add(fn);
    }
  }
  // Waterfall
  if(Math.random()>.65){
    const ws=Math.random()>.5?1:-1,wx=ws*(14+Math.random()*4);
    const wz=z+SEG_LEN/2,wh=14+Math.random()*10;
    const wf=new THREE.Mesh(new THREE.PlaneGeometry(2.5,wh),wtrMat);
    wf.position.set(wx,wh/2,wz); wf.rotation.y=-ws*.4; g.add(wf);
  }
  // Arch
  if(Math.random()>.55){
    const ax=(Math.random()>.5?-1:1)*8,az=z+SEG_LEN/2,ah=7+Math.random()*5;
    for(const sx of[-2.5,2.5]){
      const ap=new THREE.Mesh(new THREE.BoxGeometry(1.2,ah,1.2),colMat);
      ap.position.set(ax+sx,ah/2,az); ap.castShadow=true; g.add(ap);
    }
    const lin=new THREE.Mesh(new THREE.BoxGeometry(6.5,1.1,1.2),colMat);
    lin.position.set(ax,ah+.55,az); g.add(lin);
  }
  scene.add(g); segments.push(g);
}

      const blk=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),bldMat);
      blk.position.set(bx,bh/2,bz); blk.castShadow=true; g.add(blk);
      if(Math.random()>.35){
        const wm=new THREE.MeshBasicMaterial({color:STAGES[si].acc});

          const w=new THREE.Mesh(new THREE.BoxGeometry(bw*.7,.35,.1),wm);
          w.position.set(bx,r*4-2,bz+(side>0?-bd/2-.06:bd/2+.06)); g.add(w);
        }
      }
    }
  }
  scene.add(g); segments.push(g);
}

let segments=[], obstacles=[], collectibles=[], particles=[];
function lastSegZ(){ return segments.length?segments[segments.length-1].userData.z+SEG_LEN:pz; }

function makeSegment(z){ makeJungle(z); } // lush Fukui valley for every stage

function refreshTrack(){
  while(lastSegZ()<pz+SEGS_AHEAD*SEG_LEN){ const z=lastSegZ(); makeSegment(z); spawnObs(z); spawnLens(z); }
  segments=segments.filter(s=>{
    if(s.userData.z<pz-SEGS_BACK*SEG_LEN){scene.remove(s);return false;} return true;
  });
}

function spawnObs(z){
  if(Math.random()<.55){
    const sz=z+10+Math.random()*18, type=Math.floor(Math.random()*3);
    let obs;
    if(type===0){
      const lane=Math.floor(Math.random()*3);
      obs=new THREE.Mesh(new THREE.BoxGeometry(2.8,2.6,1.3),M.obsRed);
      obs.position.set(LANES[lane],1.3,sz); obs.userData={type:'block',lane};
    } else if(type===1){
      const lane=Math.floor(Math.random()*3);
      obs=new THREE.Group();
      const bar=new THREE.Mesh(new THREE.BoxGeometry(2.8,.5,.3),M.obsOrange);
      bar.position.y=1.5;
      const pL=new THREE.Mesh(new THREE.BoxGeometry(.2,1.5,.2),M.obsOrange);
      pL.position.set(-1.2,.75,0);
      obs.add(bar,pL,pL.clone()); obs.children[2].position.set(1.2,.75,0);
      obs.position.set(LANES[lane],0,sz); obs.userData={type:'barrier',lane};
    } else {
      const safe=Math.floor(Math.random()*3);
      obs=new THREE.Group();
      for(let l=0;l<3;l++){
        if(l===safe)continue;
        const blk=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.2,1.1),M.obsRed);
        blk.position.set(LANES[l],1.1,0); obs.add(blk);
      }
      obs.position.set(0,0,sz); obs.userData={type:'multi',safe};
    }
    obs.castShadow=true; scene.add(obs); obstacles.push(obs);
  }
}
// 鯖江の眼鏡コレクタブル — gold frames + glowing lenses, stands upright to run through
const goldMat =new THREE.MeshLambertMaterial({color:0xffcc33,emissive:0x6a4a00});
const lensFill=new THREE.MeshBasicMaterial({color:0x6effff,transparent:true,opacity:.55,side:THREE.DoubleSide});
function spawnLens(z){
  if(Math.random()<.75){
    const lane=Math.floor(Math.random()*3), cnt=2+Math.floor(Math.random()*4);
    for(let i=0;i<cnt;i++){
      const g=new THREE.Group();
      const R=0.38;
      const ring=new THREE.TorusGeometry(R,0.1,10,22);
      const fill=new THREE.CircleGeometry(R-0.03,20);
      // Left + right lenses (rim + glowing fill)
      const lL=new THREE.Mesh(ring,goldMat);        lL.position.x=-(R+0.05);
      const fL=new THREE.Mesh(fill,lensFill);        fL.position.set(-(R+0.05),0,0.01);
      const lR=new THREE.Mesh(ring.clone(),goldMat); lR.position.x= (R+0.05);
      const fR=new THREE.Mesh(fill.clone(),lensFill);fR.position.set( (R+0.05),0,0.01);
      // Bridge + temple arms
      const br=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.09,0.09),goldMat);
      const aL=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.7),goldMat); aL.position.set(-(2*R+0.05),0,-0.33);
      const aR=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.7),goldMat); aR.position.set( (2*R+0.05),0,-0.33);
      g.add(lL,fL,lR,fR,br,aL,aR);
      // upright, facing the camera so the player runs straight through them
      g.position.set(LANES[lane],1.55,z+9+i*3.0);
      g.userData.lane=lane;
      scene.add(g); collectibles.push(g);
    }
  }
}

//  GAME STATE
// ═══════════════════════════════════════════
let running=false,lane=1,pz=0,px=0,py=0,pvy=0;
let jumping=false,sliding=false,slideT=0;
let score=0,lensCount=0,dist=0,speed=BASE_SPEED;
let stageIdx=0,stageDist=0,laneCD=0,camX=0,invTimer=0;

// ═══════════════════════════════════════════
//  INPUT: keyboard
// ═══════════════════════════════════════════
addEventListener('keydown',e=>{
  if(!running)return;
  if(e.code==='ArrowLeft' &&lane>0&&laneCD<=0){lane--;laneCD=.08;}
  if(e.code==='ArrowRight'&&lane<2&&laneCD<=0){lane++;laneCD=.08;}
  if((e.code==='Space'||e.code==='ArrowUp')&&!jumping&&!sliding){jumping=true;pvy=JUMP_VY;e.preventDefault();}
  if(e.code==='ArrowDown'&&!jumping){sliding=true;slideT=.65;e.preventDefault();}
});
let tx0=0,ty0=0;
addEventListener('touchstart',e=>{
  // D-pad has its own handlers — don't steal its origin point
  if(e.target.closest&&e.target.closest('#dpad'))return;
  tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
},{passive:true});
addEventListener('touchend',e=>{
  if(!running)return;
  // D-pad buttons handle themselves — global swipe must not override them
  if(e.target.closest&&e.target.closest('#dpad'))return;
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>28&&ax>ay){if(dx<0&&lane>0){lane--;laneCD=.08;}if(dx>0&&lane<2){lane++;laneCD=.08;}}
  else if(ay>28&&ay>ax){
    if(dy<0&&!jumping&&!sliding){jumping=true;pvy=JUMP_VY;}
    if(dy>0&&!jumping){sliding=true;slideT=.65;}
  }
},{passive:true});

// ═══════════════════════════════════════════
//  INPUT: virtual D-pad
// ═══════════════════════════════════════════
function bindBtn(id, fn){
  const el=document.getElementById(id);
  const press=()=>{ el.classList.add('pressed'); fn(); };
  const release=()=>el.classList.remove('pressed');
  el.addEventListener('touchstart', e=>{ e.preventDefault(); press(); },{passive:false});
  el.addEventListener('touchend',   e=>{ e.preventDefault(); release(); },{passive:false});
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup',  release);
  el.addEventListener('mouseleave',release);
}
function doLeft() { if(running&&lane>0&&laneCD<=0){lane--;laneCD=.08;} }
function doRight(){ if(running&&lane<2&&laneCD<=0){lane++;laneCD=.08;} }
function doJump() { if(running&&!jumping&&!sliding){jumping=true;pvy=JUMP_VY;} }
function doSlide(){ if(running&&!jumping){sliding=true;slideT=.65;} }
bindBtn('db-left', doLeft);
bindBtn('db-right',doRight);
bindBtn('db-up',   doJump);
bindBtn('db-down', doSlide);

// ═══════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════
function collide(){
  collectibles=collectibles.filter(c=>{
    if(c.position.z<pz-12){scene.remove(c);return false;}
    if(Math.abs(c.position.z-pz)<2.4&&Math.abs(c.position.x-px)<2.0&&Math.abs(c.position.y-py-1.3)<1.5){
      burst(c.position.x,c.position.y,c.position.z); scene.remove(c); lensCount++; return false;
    }
    return true;
  });
  if(invTimer>0)return;
  for(const o of obstacles){
    const dz=Math.abs(o.position.z-pz);
    if(dz>7)continue;
    let hit=false;
    if(o.userData.type==='block')  hit=Math.abs(o.position.x-px)<2.3&&dz<2.1&&py<2.4;
    if(o.userData.type==='barrier')hit=Math.abs(o.position.x-px)<2.3&&dz<1.8&&!sliding;
    if(o.userData.type==='multi')  hit=lane!==o.userData.safe&&dz<2.1&&py<2.4;
    if(hit){ trexGap=Math.max(trexGap-TREX_HIT_GAIN,5); die(); return; }
  }
}

// ═══════════════════════════════════════════
//  BANNER / GAME OVER
// ═══════════════════════════════════════════
let bannerTO=null;
function showBanner(txt){
  const b=document.getElementById('banner');
  b.textContent=txt; b.classList.add('show');
  clearTimeout(bannerTO);
  bannerTO=setTimeout(()=>b.classList.remove('show'),3000);
}
function die(){
  running=false;
  document.body.classList.remove('camshake');
  const dp2=document.getElementById('dpulse');
  if(dp2){ dp2.classList.remove('on'); dp2.style.opacity='0'; }
  document.getElementById('trex-wrap').style.height='0';
  document.getElementById('trex-wrap').style.opacity='0';
  document.getElementById('dangertxt').classList.remove('show');
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <img class="dino-photo" src="assets/trex.jpg" alt="">
    <h1>GAME<br>OVER</h1>
    <div class="osub" style="color:#ff4422;font-size:16px;letter-spacing:3px;margin-bottom:12px">
      — フクイラプトルに捕まった —
    </div>
    <div class="osub">
      SCORE &nbsp;<span style="color:#00ffff;font-size:22px">${score.toLocaleString()}</span><br>
      👓 メガネ × ${lensCount}
    </div>
    <button id="sbtn" onclick="startGame()">▶ もう一度</button>`;
  ov.classList.remove('hidden');
  document.getElementById('ctrl').classList.add('hidden');
}

// ═══════════════════════════════════════════
//  START
// ═══════════════════════════════════════════
function startGame(){
  [...obstacles,...collectibles,...particles,...segments].forEach(o=>scene.remove(o));
  obstacles=[];collectibles=[];particles=[];segments=[];

  lane=1;pz=0;px=LANES[1];py=0;pvy=0;
  jumping=false;sliding=false;slideT=0;
  score=0;lensCount=0;dist=0;
  speed=BASE_SPEED;stageIdx=0;stageDist=0;
  laneCD=0;camX=0;invTimer=0;legT=0;
  trexGap=TREX_START_GAP;

  applyStage(STAGES[0]);
  sun.position.set(8,25,-12);

  if(!pg)buildPlayer();
  pg.position.set(LANES[1],0,0);
  pg.scale.set(1,1,1);pg.visible=true;

  buildTrex();
  buildMountains();

  camera.position.set(0,9.5,-CAM_BACK);
  camera.lookAt(0,4,30);

  for(let i=0;i<SEGS_AHEAD;i++){ const sz=i*SEG_LEN-SEG_LEN*2; makeSegment(sz); if(sz>=SEG_LEN) spawnLens(sz); }

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('ctrl').classList.remove('hidden');
  showBanner(`${STAGES[0].name} — ${STAGES[0].sub}`);

  clock.getDelta();
  running=true;
}

// ═══════════════════════════════════════════
//  ANIMATE
// ═══════════════════════════════════════════
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  if(!running){renderer.render(scene,camera);return;}

  speed=BASE_SPEED+dist*.0025;
  const move=speed*dt;
  dist+=move;pz+=move;

  px+=(LANES[lane]-px)*Math.min(dt*13,1);

  if(jumping){pvy-=GRAVITY*dt;py+=pvy*dt;if(py<=0){py=0;pvy=0;jumping=false;}}
  if(sliding){slideT-=dt;if(slideT<=0)sliding=false;}

  pg.position.set(px,py,pz);
  pg.scale.y+=(( sliding?.52:1)-pg.scale.y)*dt*12;
  pg.scale.z+=(( sliding?1.7:1)-pg.scale.z)*dt*12;

  if(!sliding&&!jumping){
    legT+=dt*speed*.38;
    leftLeg.rotation.x = Math.sin(legT)*.65;
    rightLeg.rotation.x=-Math.sin(legT)*.65;
  } else {
    leftLeg.rotation.x +=(0-leftLeg.rotation.x)*dt*9;
    rightLeg.rotation.x+=(0-rightLeg.rotation.x)*dt*9;
  }
  const sh=pg.userData.shadow;
  sh.scale.setScalar(1-py*.03);
  sh.material.opacity=Math.max(.05,.28-py*.015);

  // Camera — steady chase-cam framing player + Fukuiraptor + valley
  camX+=(px*.30-camX)*dt*6;
  camera.position.set(camX, 9.5+py*.2, pz-CAM_BACK);
  camera.lookAt(px*.16, 4.0, pz+30);
  sun.position.set(px+10,30,pz+6);

  // Infinite mountain ridge — recycle peaks that fall behind
  for(const m of mountains){ if(m.position.z < pz-150) m.position.z += MTN_RANGE; }

  const t=Date.now()*.003;
  collectibles.forEach(c=>{
    // Glasses groups spin on Y (stays flat); mesh toruses spin on Z
    if(c.isGroup) c.rotation.y+=dt*2.0;
    else c.rotation.z+=dt*2.5;
    c.position.y=1.28+Math.sin(t+c.position.z*.3)*.22;
  });

  particles=particles.filter(p=>{
    p.userData.life-=dt;
    if(p.userData.life<=0){scene.remove(p);return false;}
    p.position.x+=p.userData.vx*dt;
    p.position.y+=p.userData.vy*dt;
    p.userData.vy-=16*dt;
    p.position.z+=p.userData.vz*dt;
    p.material.opacity=p.userData.life/p.userData.maxLife;
    return true;
  });

  obstacles=obstacles.filter(o=>{
    if(o.position.z<pz-15){scene.remove(o);return false;} return true;
  });

  laneCD=Math.max(0,laneCD-dt);
  invTimer=Math.max(0,invTimer-dt);
  pg.visible=invTimer>0?Math.floor(Date.now()/90)%2===0:true;

  stageDist+=move;
  if(stageDist>STAGE_DIST){
    stageDist=0;stageIdx=(stageIdx+1)%STAGES.length;
    applyStage(STAGES[stageIdx]);
    showBanner(`${STAGES[stageIdx].name} — ${STAGES[stageIdx].sub}`);
  }

  refreshTrack();
  updateTrex(dt,move);
  collide();

  // Speed lines intensity
  document.getElementById('speedlines').style.opacity=Math.min(.9,(speed-BASE_SPEED)/30);

  // HUD
  const sc=String(Math.floor(dist*12)).padStart(6,'0');
  document.getElementById('score').textContent=sc;
  document.getElementById('lenses').textContent='👓 メガネ × '+lensCount;
  document.getElementById('spd').textContent='SPD '+Math.floor(speed).toString().padStart(3,'0');

  renderer.render(scene,camera);
}

// ── BOOT
applyStage(STAGES[0]);
animate();
</script>
</body>
</html>
